name: Maintain README Back-to-Top Navigation

on:
  push:
    branches:
      - main
    paths:
      - '**.md'
      - '.github/workflows/readme-back-to-top.yml'

permissions:
  contents: write

jobs:
  maintain-navigation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Clean ChatGPT citation glyphs from Markdown
        shell: python
        run: |
          from pathlib import Path
          import re

          for path in Path('.').rglob('*.md'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')

              # Convert supported ChatGPT URL citations to ordinary Markdown links.
              text = re.sub(
                  r'url([^]+)(https?://[^]+)',
                  lambda m: f'[{m.group(1)}]({m.group(2)})',
                  text,
              )
              # Remove citation-only constructs when no destination is available.
              text = re.sub(r'cite[^]+', '', text)
              # Remove any leftover ChatGPT citation glyphs so they can never appear
              # as literal characters in the repository's Markdown.
              text = text.replace('', '').replace('', '')

              text = re.sub(r'\n{3,}', '\n\n', text)
              path.write_text(text.rstrip() + '\n', encoding='utf-8')

      - name: Maintain README upgrade navigation
        shell: python
        run: |
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          top_anchor = '<a id="top"></a>'
          if not text.startswith(top_anchor):
              text = top_anchor + '\n\n' + text.lstrip()

          lines = text.splitlines()
          sections = []
          in_fence = False
          fence = None
          for i, line in enumerate(lines):
              stripped = line.strip()
              if stripped.startswith('```') or stripped.startswith('~~~'):
                  marker = stripped[:3]
                  if not in_fence:
                      in_fence = True
                      fence = marker
                  elif marker == fence:
                      in_fence = False
                      fence = None
                  continue
              if not in_fence and line.startswith('# ') and not line.startswith('# 🎵'):
                  sections.append(i)

          insertions = []
          for n, start in enumerate(sections):
              end = sections[n + 1] if n + 1 < len(sections) else len(lines)
              block = lines[start:end]
              if any('href="#top"' in x or '](#top)' in x for x in block):
                  continue
              midpoint = start + max(1, (end - start) // 2)
              candidates = []
              in_block_fence = False
              for i in range(start + 1, end):
                  s = lines[i].strip()
                  if s.startswith('```') or s.startswith('~~~'):
                      in_block_fence = not in_block_fence
                      continue
                  if not in_block_fence and not s and i > start + 2:
                      candidates.append(i)
              insert_at = min(candidates, key=lambda x: abs(x - midpoint)) if candidates else midpoint
              insertions.append((insert_at, '<div align="right"><a href="#top">⬆️ Back to top</a></div>'))

          for index, link in sorted(insertions, reverse=True):
              lines.insert(index, link)

          path.write_text('\n'.join(lines).rstrip() + '\n', encoding='utf-8')

      - name: Verify all Markdown files
        shell: python
        run: |
          from pathlib import Path
          forbidden = ('', '')
          bad = []
          for path in Path('.').rglob('*.md'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              if any(token in text for token in forbidden):
                  bad.append(str(path))
          if bad:
              raise SystemExit('Forbidden citation glyphs remain in: ' + ', '.join(bad))

          readme = Path('README.md').read_text(encoding='utf-8')
          required = (
              '<a id="top"></a>',
              'SUNO-V6-ULTIMATE-CONTROL-AND-PRODUCTION-ADDENDUM-2026.md',
              '⬆️ Back to top',
          )
          missing = [token for token in required if token not in readme]
          if missing:
              raise SystemExit(f'README verification failed; missing: {missing}')
          print('All Markdown glyph checks and README navigation checks passed.')

      - name: Commit Markdown cleanup
        shell: bash
        run: |
          if git diff --quiet -- '*.md'; then
            echo "Markdown is already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.md'
          git commit -m "Remove stray citation glyphs from Markdown [skip ci]"
          git push

name: Maintain README Back-to-Top Navigation

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - SUNO-V6-ULTIMATE-CONTROL-AND-PRODUCTION-ADDENDUM-2026.md
      - docs/superpowers/plans/2026-09-13-suno-v6-complete-upgrade.md
      - docs/superpowers/plans/readme-maintenance-trigger.md
      - .github/workflows/readme-back-to-top.yml

permissions:
  contents: write

jobs:
  maintain-navigation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Clean citation markup and add upgrade navigation
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')

          text = re.sub(
              r'url([^]+)(https?://[^]+)',
              lambda m: f'[{m.group(1)}]({m.group(2)})',
              text,
          )
          text = re.sub(r'cite[^]+', '', text)
          text = re.sub(r'\n{3,}', '\n\n', text)

          addendum_path = 'SUNO-V6-ULTIMATE-CONTROL-AND-PRODUCTION-ADDENDUM-2026.md'
          addendum_line = f'- **[{addendum_path}]({addendum_path})** — the 2026 ultimate control, testing, Studio 2.0, diagnostic, rights, platform and Creator\'s Operating System addendum.'

          if addendum_line not in text:
              marker = '## Deep-Dive Expansion Files'
              if marker in text:
                  text = text.replace(marker, marker + '\n\n' + addendum_line, 1)
              else:
                  text += f'\n\n## 🧩 2026 Ultimate Upgrade\n\n{addendum_line}\n'

          quick_nav_marker = '- [Accuracy Policy](#-accuracy-policy)'
          quick_nav_upgrade = '- [2026 Ultimate Control & Production Addendum](#-2026-ultimate-control--production-addendum)'
          if quick_nav_marker in text and quick_nav_upgrade not in text:
              text = text.replace(quick_nav_marker, quick_nav_upgrade + '\n' + quick_nav_marker, 1)

          path.write_text(text.rstrip() + '\n', encoding='utf-8')

      - name: Insert section back-to-top links
        shell: python
        run: |
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          top_anchor = '<a id="top"></a>'
          if not text.startswith(top_anchor):
              text = top_anchor + '\n\n' + text.lstrip()

          lines = text.splitlines()
          sections = []
          in_fence = False
          fence = None
          for i, line in enumerate(lines):
              stripped = line.strip()
              if stripped.startswith('```') or stripped.startswith('~~~'):
                  marker = stripped[:3]
                  if not in_fence:
                      in_fence = True
                      fence = marker
                  elif marker == fence:
                      in_fence = False
                      fence = None
                  continue
              if not in_fence and line.startswith('# ') and not line.startswith('# 🎵'):
                  sections.append(i)

          insertions = []
          for n, start in enumerate(sections):
              end = sections[n + 1] if n + 1 < len(sections) else len(lines)
              block = lines[start:end]
              if any('href="#top"' in x or '](#top)' in x for x in block):
                  continue
              midpoint = start + max(1, (end - start) // 2)
              candidates = []
              in_block_fence = False
              for i in range(start + 1, end):
                  s = lines[i].strip()
                  if s.startswith('```') or s.startswith('~~~'):
                      in_block_fence = not in_block_fence
                      continue
                  if not in_block_fence and not s and i > start + 2:
                      candidates.append(i)
              insert_at = min(candidates, key=lambda x: abs(x - midpoint)) if candidates else midpoint
              insertions.append((insert_at, '<div align="right"><a href="#top">⬆️ Back to top</a></div>'))

          for index, link in sorted(insertions, reverse=True):
              lines.insert(index, link)

          path.write_text('\n'.join(lines).rstrip() + '\n', encoding='utf-8')

      - name: Verify README content
        shell: python
        run: |
          from pathlib import Path
          text = Path('README.md').read_text(encoding='utf-8')
          forbidden = ('cite', 'url')
          if any(token in text for token in forbidden):
              raise SystemExit('README still contains ChatGPT-only citation markup.')
          required = (
              '<a id="top"></a>',
              'SUNO-V6-ULTIMATE-CONTROL-AND-PRODUCTION-ADDENDUM-2026.md',
              '⬆️ Back to top',
          )
          missing = [token for token in required if token not in text]
          if missing:
              raise SystemExit(f'README verification failed; missing: {missing}')
          print('README verification passed.')

      - name: Commit navigation updates
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "README already has complete navigation and clean Markdown links."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Maintain README navigation and GitHub links [skip ci]"
          git push
